<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Dhi.in</title>
    <meta name="description" content="Ini adalah Website Tugas Saya" />
    <link rel="stylesheet" href="css/styles.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <header>
        <div data-aos="fade-down" data-aos-delay="500ms" class="brand">
          <div class="logo"><img src="img/logo.png" alt="logos" /></div>
          <div>
            <div style="font-weight: 700">Dhi.In</div>
            <div style="font-weight: 12px; color: var(--muted)">
              Portofolio Website
            </div>
          </div>
        </div>
        <nav data-aos="fade-down">
          <a href="indeks.html">Home</a>
          <a href="work.html">Karya</a>
          <a href="about.html">About</a>
        </nav>
      </header>

      <section data-aos="fade-up" data-aos-delay="300ms" id="hero">
        <h2 align="center">Portofolio</h2>
        <div class="card-box">
          <div class="gallery">
            <div class="thumb">
              <a
                href="https://drive.google.com/drive/folders/1YMAMFUIzJSY7CljvVyw28AswaVnXaAP3?usp=drive_link"
              >
                <img src="img/thumb-1.jpg" alt="Karya1" />
              </a>
            </div>
            <div class="thumb">
              <a
                href="https://drive.google.com/drive/folders/1NE7HB10JcCG2M7SRFU0hzqsQc494FbA1"
              >
                ><img src="img/thumb-2.jpg" alt="Karya2" />
              </a>
            </div>
            <div class="thumb">
              <a
                href="https://drive.google.com/drive/folders/10cVZfynCOxQHKIlQQ-tCEsHLZbJickTZ"
              >
                <img src="img/thumb-3.jpg" alt="Karya3" />
              </a>
            </div>
          </div>
        </div>
      </section>
      <footer style="font-size: small">
        © <span id="year"></span> Ardhi — Copyrights.
      </footer>
    </div>

    <script>
      // Simple JS: tahun dinamis dan smooth scroll
      document.getElementById("year").textContent = new Date().getFullYear();
      document.querySelectorAll('a[href^="#"]').forEach((a) => {
        a.addEventListener("click", (e) => {
          const target = document.querySelector(a.getAttribute("href"));
          if (target) {
            e.preventDefault();
            target.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });
      });
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
